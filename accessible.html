<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Table</title>

</head>

<body>
<header>
    <h3>
        <span style="background-color: aqua;">HTML TABLE</span>
    </h3>
</header>


    <main>
        <table>
            <caption style="background-color: aquamarine;">
                Student info:
            </caption>

            <colgroup>
            <col span="3" style="background-color: aqua;"/>
        </colgroup>
    </main>

    <tr>
        <th scope="col">ID</th>
        <th scope="col">NAME</th>
        <th scope="col">GPA</th>
    </tr>

    <tr>
        <td scope="row" >102</td>
        <td>Jabed</td>
        <td>4.00</td>
    </tr>

    <tr>
        <td>103</td>
        <td>Jabed</td>
        <td>3.45 </td>
    </tr>

    </table>
</body>

</html>
