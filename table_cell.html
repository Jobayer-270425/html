<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table cell spanning attributes</title>
    <style>
        table,
        td,
        th {
            border: 3px solid black;
            width: 300px;
            height: 50px;
        }

        table {
            /* border-collapse: collapse; */
            border-spacing: 2px; 
        }


        th,
        td {
            text-align: center;
            padding: 5px;
        }

            
    </style>
</head>

<body>
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th colspan="2">PHONE</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">875246</td>
                <td>Jobayer</td>
                <td rowspan="2">0189414394</td>
                <td>01550424571</td>
            </tr>

            <tr>
                <td>Jabed</td>
                <td>01330424911</td>
            </tr>

            <tr>
                <td>875248</td>
                <td>Rakiya</td>
                <td>01607193958</td>
                <td>01607193958</td>
            </tr>

            <tr>
                <td>875250</td>
                <td>Shato</td>
                <td colspan="2">01711338385</td>
            </tr>
        </tbody>

    </table>
</body>

</html>
